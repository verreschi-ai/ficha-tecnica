name: Keep Ficha Técnica awake

# O plano gratuito do Render coloca o serviço pra dormir depois de ~15
# minutos sem receber nenhuma requisição — a primeira consulta depois disso
# demora bem mais pra responder e, às vezes, chega a devolver 429/503
# enquanto a instância ainda está acordando (visto no painel de marketing,
# que consome o GET /api/export/summary deste app). Um ping simples a cada
# 10 minutos evita que o serviço chegue a dormir.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        continue-on-error: true
        run: curl -fsS --max-time 60 https://ficha-tecnica-don-giovanni.onrender.com/api/health
