services:
  - type: web
    name: ficha-tecnica-don-giovanni
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_PUBLIC_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EXPORT_API_TOKEN
        sync: false
      - key: EXPORT_OWNER_EMAIL
        sync: false
